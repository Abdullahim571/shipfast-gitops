apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipfast
  namespace: shipfast
  labels:
    app.kubernetes.io/name: shipfast
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shipfast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipfast
    spec:
      # Matches the UID/GID baked into the Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shipfast
          image: abddullahi571/shipfast-status:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: shipfast-config
                  key: APP_ENV
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # gunicorn needs a writable temp dir for worker heartbeat files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
